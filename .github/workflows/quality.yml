name: Quality chain

# Runs paydecode.com's full pre-deploy quality chain (npm run cf:deploy:dry-run) on the head of the
# release branch, nightly and on dispatch. This replaces the billed workflow in the private source
# repository; only the checkout token is needed and no secrets reach the site build.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch of abuhasnatruhu/paydecode.com to check (default: the PAYDECODE_SOURCE_REF variable)"
        required: false
        type: string
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: quality-${{ inputs.source_ref || 'scheduled' }}
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: abuhasnatruhu/paydecode.com

jobs:
  verify:
    name: Full dry-run quality chain
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve the branch head
        id: resolve
        shell: bash
        env:
          INPUT_REF: ${{ inputs.source_ref }}
          DEFAULT_REF: ${{ vars.PAYDECODE_SOURCE_REF || 'main' }}
          SOURCE_TOKEN: ${{ secrets.PAYDECODE_SOURCE_TOKEN1 }}
        run: |
          ref="${INPUT_REF:-$DEFAULT_REF}"
          [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "branch name invalid"; exit 1; }
          sha="$(git ls-remote "https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPOSITORY}.git" "refs/heads/${ref}" | cut -f1)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "could not resolve the head of ${ref}"; exit 1; }
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"; echo "source_ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out the source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ steps.resolve.outputs.source_sha }}
          token: ${{ secrets.PAYDECODE_SOURCE_TOKEN1 }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set current UTC build date
        shell: bash
        run: |
          echo "PAYDECODE_BUILD_AS_OF=$(date -u +%F)" >> "$GITHUB_ENV"
          echo "MIN_WAGE_AS_OF=$(date -u +%F)" >> "$GITHUB_ENV"
      # The payroll baseline reproduction pins Node 24.14.0 exactly (scripts/generate-payroll-current-baseline.mjs).
      - name: Use Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Point the repository's node wrapper at this runtime
        run: echo "NODE22_BIN=$(command -v node)" >> "$GITHUB_ENV"
      - name: Install pdftotext (retained PDF evidence is verified on its extracted text)
        shell: bash
        run: |
          set -euo pipefail
          verify_pdftotext() {
            local binary owner integrity package_version version_output version_line
            binary="$(command -v pdftotext)" || return 1
            [[ "$binary" == /usr/bin/pdftotext && -f "$binary" && ! -L "$binary" && -x "$binary" ]] || return 1
            [[ "$(stat -c '%u:%g:%a' "$binary")" == '0:0:755' ]] || return 1
            owner="$(dpkg-query -S "$binary")" || return 1
            [[ "$owner" =~ ^poppler-utils(:[a-z0-9-]+)?:[[:space:]]/usr/bin/pdftotext$ ]] || return 1
            [[ "$(dpkg-query -W -f='${Status}' poppler-utils)" == 'install ok installed' ]] || return 1
            integrity="$(dpkg --verify poppler-utils)" || return 1
            [[ -z "$integrity" ]] || return 1
            package_version="$(dpkg-query -W -f='${Version}' poppler-utils)" || return 1
            [[ -n "$package_version" ]] || return 1
            version_output="$(timeout --kill-after=5s 10s "$binary" -v 2>&1)" || return 1
            version_line="${version_output%%$'\n'*}"
            [[ "$version_line" =~ ^pdftotext[[:space:]]version[[:space:]][0-9]+(\.[0-9]+){1,2}$ ]] || return 1
            echo "Verified system pdftotext (poppler-utils ${package_version})"
          }
          if ! verify_pdftotext; then
            # Change only the known Azure HTTP archive URI; suites and signing keys stay intact.
            for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [[ -f "$apt_source" && ! -L "$apt_source" ]]; then
                sudo sed -E -i -e ':ubuntu_uri' -e 's#(^|[[:space:]])http://azure\.archive\.ubuntu\.com/ubuntu(/?)([[:space:]]|$)#\1https://archive.ubuntu.com/ubuntu\2\3#g' -e 't ubuntu_uri' "$apt_source"
              fi
            done
            apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o APT::Update::Error-Mode=any -o Acquire::AllowInsecureRepositories=false -o Acquire::AllowDowngradeToInsecureRepositories=false -o APT::Get::AllowUnauthenticated=false)
            sudo timeout --kill-after=15s 180s apt-get "${apt_options[@]}" update
            sudo timeout --kill-after=15s 180s apt-get "${apt_options[@]}" install -y poppler-utils
            verify_pdftotext || { echo 'Trusted system pdftotext is unavailable; PDF checks cannot continue.'; exit 1; }
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Secrets scan
        run: npm run qa:no-secrets
      - name: Full pre-deploy dry-run
        run: npm run cf:deploy:dry-run
      - name: Summarise
        if: ${{ always() }}
        run: |
          echo "Quality chain for ${{ env.SOURCE_REPOSITORY }}@${{ steps.resolve.outputs.source_sha }} (${{ steps.resolve.outputs.source_ref }}) - ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
