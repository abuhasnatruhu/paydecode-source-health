name: Three fixed statutory authority captures only

# Artifact collection only; no URL/ref/SHA/job-ID dispatch inputs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statutory-authority-capture-only-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: abuhasnatruhu/paydecode.com
  PAYDECODE_SOURCE_SHA: a53eedb0ce508918f21e5958e78a61d07cd4c542

jobs:
  capture:
    if: ${{ github.repository == 'abuhasnatruhu/paydecode-source-health' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source_id: [nm-nmac-11-1-4, nm-nmsa-chapter50, tx-labor62]
    steps:
      - name: Check out the reviewed runner workflow and tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: health
          persist-credentials: false
      - name: Check out the exact existing source and unchanged signer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.PAYDECODE_SOURCE_SHA }}
          token: ${{ secrets.PAYDECODE_SOURCE_TOKEN1 }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify both checkouts and unchanged signer pins before any request
        shell: bash
        env:
          EXPECTED_HEALTH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git --no-replace-objects -C health rev-parse HEAD)" == "$EXPECTED_HEALTH_SHA" ]]
          [[ "$(git --no-replace-objects -C source rev-parse HEAD)" == "$PAYDECODE_SOURCE_SHA" ]]
          [[ "$PAYDECODE_SOURCE_SHA" == a53eedb0ce508918f21e5958e78a61d07cd4c542 ]]
          git -C health diff --quiet
          git -C health diff --cached --quiet
          git -C source diff --quiet
          git -C source diff --cached --quiet
          cd source
          printf '%s\n' \
            '2e84076661a2382b2c277ba76c2dcd262d28972760804594339fe9b5441f2df5  scripts/sign-source-receipts.mjs' \
            'f66c56b4744a762fe2ef75cacfe97fa8d5dbd7ffce48c55a1b9aafd7a142411a  scripts/lib/receipt-signature.mjs' \
            '3b63308793c627ae29a972dbd188708d43afbacc221e2dadd1e2bccf0ff719c9  scripts/lib/receipt-signing-public-key.pem' \
            '8e5e7d259a5ed672c84a5281c97094345f480ba7eaa4d8c21755fa007bfd9ecb  scripts/qa-receipt-provenance.mjs' \
            | sha256sum --check --strict -
      - name: Use the existing pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
      - name: Run network-free capture-tool negative controls
        run: node health/scripts/qa-statutory-authority-capture-only.mjs
      - name: Verify trusted system Poppler only for the fixed PDF target
        if: ${{ matrix.source_id == 'nm-nmsa-chapter50' }}
        shell: bash
        run: |
          set -euo pipefail
          verify_poppler() {
            local name binary owner integrity package_version version_output version_line
            [[ "$(dpkg-query -W -f='${Status}' poppler-utils)" == 'install ok installed' ]] || return 1
            integrity="$(dpkg --verify poppler-utils)" || return 1
            [[ -z "$integrity" ]] || return 1
            package_version="$(dpkg-query -W -f='${Version}' poppler-utils)" || return 1
            [[ -n "$package_version" ]] || return 1
            for name in pdfinfo pdftotext; do
              binary="$(command -v "$name")" || return 1
              [[ "$binary" == "/usr/bin/$name" && -f "$binary" && ! -L "$binary" && -x "$binary" ]] || return 1
              [[ "$(stat -c '%u:%g:%a' "$binary")" == '0:0:755' ]] || return 1
              owner="$(dpkg-query -S "$binary")" || return 1
              [[ "$owner" =~ ^poppler-utils(:[a-z0-9-]+)?:[[:space:]]/usr/bin/$name$ ]] || return 1
              version_output="$(timeout --kill-after=5s 10s "$binary" -v 2>&1)" || return 1
              version_line="${version_output%%$'\n'*}"
              [[ "$version_line" =~ ^$name[[:space:]]version[[:space:]][0-9]+(\.[0-9]+){1,2}$ ]] || return 1
            done
            echo "Verified system pdfinfo/pdftotext (poppler-utils ${package_version})"
          }
          if ! verify_poppler; then
            for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [[ -f "$apt_source" && ! -L "$apt_source" ]]; then
                sudo sed -E -i -e ':ubuntu_uri' -e 's#(^|[[:space:]])http://azure\.archive\.ubuntu\.com/ubuntu(/?)([[:space:]]|$)#\1https://archive.ubuntu.com/ubuntu\2\3#g' -e 't ubuntu_uri' "$apt_source"
              fi
            done
            apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o APT::Update::Error-Mode=any -o Acquire::AllowInsecureRepositories=false -o Acquire::AllowDowngradeToInsecureRepositories=false -o APT::Get::AllowUnauthenticated=false)
            sudo timeout --kill-after=15s 180s apt-get "${apt_options[@]}" update
            sudo timeout --kill-after=15s 180s apt-get "${apt_options[@]}" install -y poppler-utils
            verify_poppler || { echo 'Trusted system Poppler is unavailable.'; exit 1; }
          fi
      - name: Capture this fixed source once without fallback
        id: capture
        continue-on-error: true
        shell: bash
        env:
          FIXED_SOURCE_ID: ${{ matrix.source_id }}
        run: node health/scripts/capture-statutory-authority-only.mjs source "$FIXED_SOURCE_ID"
      - name: Sign only a complete eligible capture using the existing signer
        if: ${{ steps.capture.outcome == 'success' }}
        id: sign
        working-directory: source
        shell: bash
        env:
          PAYDECODE_RECEIPT_SIGNING_KEY: ${{ secrets.PAYDECODE_RECEIPT_SIGNING_KEY }}
          CAPTURE_DIRECTORY: ${{ steps.capture.outputs.capture_dir }}
        run: |
          set -euo pipefail
          [[ -n "$PAYDECODE_RECEIPT_SIGNING_KEY" && -n "$CAPTURE_DIRECTORY" ]]
          [[ "$(git --no-replace-objects rev-parse HEAD)" == "$PAYDECODE_SOURCE_SHA" ]]
          git diff --quiet
          git diff --cached --quiet
          node scripts/sign-source-receipts.mjs "$CAPTURE_DIRECTORY"
      - name: Verify signatures with the unchanged provenance gate
        if: ${{ steps.capture.outcome == 'success' && steps.sign.outcome == 'success' }}
        id: verify
        working-directory: source
        run: node scripts/qa-receipt-provenance.mjs
      - name: Extract the complete fixed PDF as separate non-admission evidence
        if: ${{ matrix.source_id == 'nm-nmsa-chapter50' && steps.capture.outcome == 'success' }}
        id: pdf
        continue-on-error: true
        shell: bash
        env:
          CAPTURE_DIRECTORY: ${{ steps.capture.outputs.capture_dir }}
        run: node health/scripts/capture-statutory-authority-only.mjs --extract-pdf source "$CAPTURE_DIRECTORY"
      - name: Preserve all new success or failure evidence
        if: ${{ always() && steps.capture.outputs.capture_dir != '' }}
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: statutory-authority-source-only-${{ matrix.source_id }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            source/${{ steps.capture.outputs.capture_dir }}
            !source/${{ steps.capture.outputs.capture_dir }}/pdf-extraction/**
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Preserve separate complete or failed PDF extraction evidence
        if: ${{ always() && steps.pdf.outputs.pdf_dir != '' }}
        id: pdf_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: statutory-authority-pdf-extraction-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: source/${{ steps.pdf.outputs.pdf_dir }}
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Report transport outcome without admission or release
        if: ${{ always() }}
        shell: bash
        env:
          FIXED_SOURCE_ID: ${{ matrix.source_id }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          PDF_OUTCOME: ${{ steps.pdf.outcome }}
          PDF_UPLOAD_OUTCOME: ${{ steps.pdf_upload.outcome }}
        run: |
          set -euo pipefail
          {
            echo '## Fixed statutory authority artifact-only source capture'
            echo "Fixed ID: $FIXED_SOURCE_ID"
            echo "Source SHA: $PAYDECODE_SOURCE_SHA"
            echo "capture=$CAPTURE_OUTCOME sign=$SIGN_OUTCOME verify=$VERIFY_OUTCOME upload=$UPLOAD_OUTCOME"
            echo "pdf=$PDF_OUTCOME pdf_upload=$PDF_UPLOAD_OUTCOME"
            echo 'One ordinary full GET per URL. No redirects, retries, proxy, cookies, Range, archive, challenge workaround, PR, review renewal, source-health clearance, mail or deployment.'
            echo 'Original bodies and sanitized HTTP header projections are retained; raw HTTP headers and curl stderr are not written or logged. Bounded PDF tool outputs are separate extraction evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$CAPTURE_OUTCOME" == success && "$SIGN_OUTCOME" == success && "$VERIFY_OUTCOME" == success && "$UPLOAD_OUTCOME" == success ]]
          if [[ "$FIXED_SOURCE_ID" == nm-nmsa-chapter50 ]]; then
            [[ "$PDF_OUTCOME" == success && "$PDF_UPLOAD_OUTCOME" == success ]]
          fi

